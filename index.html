<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday Brindha! 💖</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* Dynamic Background */
body { 
  background: linear-gradient(-45deg, #fbcfe8, #f472b6, #db2777, #9333ea);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  font-family: sans-serif; 
  min-height: 100vh; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  padding: 15px; 
  overflow: hidden; 
  user-select: none; 
  position: relative; 
}

@keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

.app-container { width: 100%; max-width: 360px; min-height: 460px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; z-index: 10; }
.stage { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
.hidden { display: none !important; }

/* Drifting Floating Hearts */
.heart { position: fixed; color: #ffffff; font-size: 20px; animation: float 4s linear infinite; opacity: 0; pointer-events: none; z-index: 1; filter: drop-shadow(0 0 5px rgba(244,114,182,0.5)); }
@keyframes float { 0% { transform: translateY(105vh) scale(0.6); opacity: 0; } 10% { opacity: 0.5; } 90% { opacity: 0.5; } 100% { transform: translateY(-10vh) scale(1.3); opacity: 0; } }

/* Pop-able Balloons */
.balloon-pop { 
  position: fixed; font-size: 3rem; cursor: pointer; animation: floatBalloon 7s linear forwards; 
  user-select: none; z-index: 15; 
}
@keyframes floatBalloon { 
  0% { transform: translateY(110vh) rotate(0deg); opacity: 1; } 
  80% { opacity: 1; } 
  100% { transform: translateY(-20vh) rotate(30deg); opacity: 0; } 
}

/* Balloon Burst Effect */
.burst { position: fixed; width: 10px; height: 10px; border-radius: 50%; animation: burstParticles 0.6s ease-out forwards; pointer-events: none; z-index: 16; }
@keyframes burstParticles { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(5) translate(var(--bx), var(--by)); opacity: 0; } }

@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
@keyframes zoomIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Standard UI */
.countdown-text { font-size: 7rem; font-weight: 300; color: white; text-shadow: 0 0 20px rgba(219,39,119,0.6); }
.kitty-img { width: 95px; height: 95px; margin-bottom: 20px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
.pink-title { color: white; font-size: 1.6rem; font-weight: 700; line-height: 1.4; margin-bottom: 25px; padding: 0 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.15); }
.btn { background: white; color: #db2777; border: none; padding: 15px 40px; border-radius: 30px; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.15); transition: 0.3s; text-transform: uppercase; letter-spacing: 0.5px; z-index: 20; }
.btn:active { transform: scale(0.95); background-color: #fff1f2; }
.cake-avatar { font-size: 7.5rem; margin: 20px 0; cursor: pointer; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15)); z-index: 20; transition: 0.2s;}
.cake-avatar:active { transform: scale(0.9); }

/* Premium Gallery */
.polaroid-frame { background: white; padding: 12px; padding-bottom: 55px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); width: 100%; max-width: 290px; position: relative; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: auto; animation: zoomIn 0.5s ease-out; z-index: 10; }
.polaroid-frame img { width: 100%; height: auto; object-fit: contain; border-radius: 6px; display: block; max-height: 380px; }
.polaroid-caption { position: absolute; bottom: 14px; left: 0; right: 0; font-size: 1.1rem; color: #db2777; font-weight: 700; font-style: italic; }
.slider-controls { display: flex; align-items: center; gap: 30px; margin-bottom: 25px; z-index: 10; }
.nav-btn { background: white; border: none; width: 48px; height: 48px; border-radius: 50%; color: #db2777; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.nav-btn:active { transform: scale(0.85); }
.counter-tag { background: rgba(255,255,255,0.25); backdrop-filter: blur(5px); padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; color: white; font-weight: 700; border: 1px solid rgba(255,255,255,0.3); }

/* Glassmorphic Letter */
.letter-paper { background: rgba(255, 255, 255, 0.96); border-radius: 24px; padding: 25px 20px; text-align: left; box-shadow: 0 25px 50px rgba(0,0,0,0.3); max-height: 75vh; overflow-y: auto; width: 100%; z-index: 20; position: relative; display: none; }
.letter-header { font-size: 1.4rem; color: #db2777; font-weight: 700; text-align: center; padding-bottom: 12px; border-bottom: 2px solid #fbcfe8; margin-bottom: 18px; }
.letter-text { font-size: 0.95rem; color: #374151; line-height: 1.65; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; }
.signature { text-align: center; margin-top: 25px; font-size: 1rem; color: #db2777; font-weight: 700; border-top: 2px solid #fbcfe8; padding-top: 15px; display: none; }
</style>
</head>
<body onclick="handleGlobalClick(event)">

<audio id="birthday-track" loop preload="auto"><source src="birthday-song.mp3" type="audio/mpeg"></audio>

<div class="app-container">
  <div id="stage-countdown" class="stage"><div id="countdown-text" class="countdown-text">3</div></div>
  <div id="stage-loading" class="stage hidden"><img src="https://api.iconify.design/twemoji:cat-face.svg" alt="Kitty" class="kitty-img"><p style="color: white; font-weight: 700;">Loading your birthday surprise...</p></div>
  <div id="stage-intro" class="stage hidden"><h1 class="pink-title">“Hey pondatiii its ur 24th birthday and 5th with me my love”</h1><button onclick="startJourneyAndMusic()" class="btn">Start the journey</button></div>
  <div id="stage-cake" class="stage hidden"><h2 id="cake-instruction" class="pink-title">Swipe anywhere to cut the cake!</h2><div onclick="cutTheCake()" id="cake-emoji" class="cake-avatar">🎂</div><button id="cake-next-btn" onclick="goToGalleryStage()" class="btn hidden">Memories →</button></div>
  <div id="stage-gallery" class="stage hidden"><h2 class="pink-title" style="margin-bottom: 15px;">Some Sweet Moments</h2><div class="polaroid-frame"><img id="main-slider-img" src="photo1.jpeg" alt="Memories"><div id="main-slider-caption" class="polaroid-caption">Mine 💖</div></div><div class="slider-controls"><button onclick="changeSlide(-1)" class="nav-btn">◀</button><span id="slide-index-counter" class="counter-tag">1 / 11</span><button onclick="changeSlide(1)" class="nav-btn">▶</button></div><button onclick="triggerGrandFinaleAndLetter()" class="btn">Open My Message</button></div>
  
  <div id="stage-message" class="stage hidden">
    <div id="letter-paper" class="letter-paper">
      <h3 class="letter-header">A Special Message</h3>
      <div id="typewriter-text" class="letter-text"></div>
      <div id="signature-block" class="signature">With Infinite Love<br>Priyadharshan Brindhaviathi❤️</div>
    </div>
  </div>
</div>

<script>
let activeIndex = 0;
const photoFiles = ["photo1.jpeg", "photo2.jpeg", "photo3.jpeg", "photo4.jpeg", "photo5.jpeg", "photo6.jpeg", "photo7.jpeg", "photo8.jpeg", "photo9.jpeg", "photo10.jpeg", "photo11.jpeg"];
const photoCaptions = ["Mine 💖", "That Beautiful Smile ✨", "Cutest Poppée 🥺", "My Ammu 🤍", "Together Forever 🫂", "Every Single Day with You 🧿", "My Goddess 🥂", "Pure Happiness 💕", "Love You 3000 ♾️", "My Safest Escape 🥰", "Forever Yours ❤️"];

const rawMessage = `Happiest 24th birthday papa,

im always happy to see u growing and im always with u and will be with u in all ur ups and down as I promised.

Enaku therium nambakula neraiya sanda and misunderstanding irku varuthunu but its all about a part of love so athalam iniku thooki oram vechitu enjoy ur day its ur day and alway be cheerful and joyful whatever happens.

aprm mukiyama unoda siripa niruthidatha ena analum bczz its what makes u the cuties popée of mine of all times so happiest birthday Ammu.

and na epaium solura mari unaku pana satyatha kandipa nera vethuven whatever happen we can talk and sort it and stay together forever na una kittu kandipa pogamaten as i promised so atha pathi epaium yosichi kavala padatha.

"odamba nala pathuku the very soon we r going to get married so be healthy papa"

I love u dii my goddess once again happy birthday papu may his year brings u all the joy and happiness to u and all ur wishes will definitely come true I manifest it for u.

and as I always say all ur bad comes to me and all ur goods and my goods comes to u papu once happiest birthday and I love u more then 3000 times mine💐 🤍 🫂 🧿 🥂
`;

function handleGlobalClick(e) {
  if (e.target.tagName === 'BUTTON' || e.target.classList.contains('cake-avatar')) return;
  spawnExplosion(e.clientX, e.clientY, ['💖', '❤']);
}

function spawnExplosion(x, y, particles) {
  for (let i = 0; i < 6; i++) {
    const heart = document.createElement('div');
    heart.innerHTML = particles[Math.random() > 0.5 ? 0 : 1];
    heart.style.position = 'fixed';
    heart.style.color = '#ff69b4';
    heart.style.fontSize = '24px';
    heart.style.pointerEvents = 'none';
    heart.style.zIndex = '9999';
    heart.style.animation = 'explode 0.8s ease-out forwards';
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    const mx = (Math.random() - 0.5) * 200 + 'px';
    const my = (Math.random() - 0.5) * 200 + 'px';
    heart.style.setProperty('--mx', mx);
    heart.style.setProperty('--my', my);
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 800);
  }
}

function createHeart() { const heart = document.createElement("div"); heart.innerHTML = Math.random() > 0.5 ? "❤" : "💖"; heart.className = "heart"; heart.style.left = Math.random() * 100 + "vw"; heart.style.bottom = "-5vh"; heart.style.animationDuration = (Math.random() * 2 + 3) + "s"; document.body.appendChild(heart); setTimeout(() => heart.remove(), 4000); }

let balloonInterval;
const balloonEmojis = ['🎈', '🍬', '✨', '🎁'];
function spawnInteractiveBalloon() {
  const balloon = document.createElement("div");
  balloon.innerHTML = balloonEmojis[Math.floor(Math.random() * balloonEmojis.length)];
  balloon.className = "balloon-pop";
  balloon.style.left = (Math.random() * 80 + 10) + "vw";
  balloon.style.fontSize = (Math.random() * 2 + 2) + "rem"; 
  balloon.style.animationDuration = (Math.random() * 3 + 6) + "s";
  balloon.onclick = function(e) { e.stopPropagation(); popBalloon(balloon, e.clientX, e.clientY); };
  document.body.appendChild(balloon);
  setTimeout(() => { if(balloon.parentNode) balloon.remove(); }, 8000);
}

function popBalloon(balloonEl, x, y) {
  balloonEl.remove();
  confetti({ particleCount: 40, spread: 60, origin: { x: x / window.innerWidth, y: y / window.innerHeight }, colors: ['#FFC0CB', '#FF69B4', '#D02090'] });
  document.body.style.animation = "shake 0.15s";
  setTimeout(() => document.body.style.animation = "", 150);
}

window.addEventListener('DOMContentLoaded', () => { let num = 3; const textNode = document.getElementById('countdown-text'); const loop = setInterval(() => { num--; if (num > 0) { textNode.innerText = num; } else { textNode.innerText = "❤"; clearInterval(loop); setTimeout(() => { hideAndShow('stage-countdown', 'stage-loading'); setTimeout(() => { hideAndShow('stage-loading', 'stage-intro'); }, 2200); }, 700); } }, 1000); });
function hideAndShow(oldId, newId) { document.getElementById(oldId).classList.add('hidden'); document.getElementById(newId).classList.remove('hidden'); }

function startJourneyAndMusic() { 
  const music = document.getElementById('birthday-track'); 
  if (music) { music.play().catch(e => console.log(e)); } 
  hideAndShow('stage-intro', 'stage-cake'); 
  setInterval(createHeart, 350);
}

function cutTheCake() { 
  document.getElementById('cake-instruction').innerText = "Happy Birthday, My Girl ! ❤️"; 
  document.getElementById('cake-emoji').innerText = "🍰✨"; 
  document.getElementById('cake-next-btn').classList.remove('hidden'); 
  document.body.style.animation = "shake 0.5s"; 
  triggerConfettiSideStreams();
}

function triggerConfettiSideStreams() {
  var duration = 3 * 1000; var end = Date.now() + duration;
  (function frame() {
    confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 } });
    confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
    if (Date.now() < end) { requestAnimationFrame(frame); }
  }());
}

function goToGalleryStage() { 
  hideAndShow('stage-cake', 'stage-gallery'); 
  balloonInterval = setInterval(spawnInteractiveBalloon, 1500);
}

function triggerGrandFinaleAndLetter() {
  hideAndShow('stage-gallery', 'stage-message');
  clearInterval(balloonInterval);
  document.querySelectorAll('.balloon-pop').forEach(b => b.remove());
  triggerSequentialFireworks();

  setTimeout(() => {
    const letter = document.getElementById('letter-paper');
    letter.style.display = 'block';
    letter.style.animation = 'zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    setTimeout(() => { startTypewriterReveal(); }, 800);
  }, 2500);
}

function triggerSequentialFireworks() {
  const fwData = [{ x: 0.1, y: 0.2 }, { x: 0.9, y: 0.2 }, { x: 0.1, y: 0.8 }, { x: 0.9, y: 0.8 }];
  fwData.forEach((fw, index) => { setTimeout(() => { massiveCrackerBurst(fw.x, fw.y); }, index * 600); });
}

function massiveCrackerBurst(x, y) {
  const colors = ['#FFD700', '#FF1493', '#00FFFF', '#FF8C00', '#ADFF2F'];
  const burstColors = [colors[Math.floor(Math.random() * colors.length)]];
  confetti({ particleCount: 150, spread: 80, origin: { x: x, y: y }, colors: burstColors, startVelocity: 60, ticks: 300 });
  confetti({ particleCount: 100, spread: 120, origin: { x: x, y: y }, colors: burstColors, startVelocity: 45, ticks: 250 });
}

function startTypewriterReveal() {
  const textContainer = document.getElementById('typewriter-text');
  textContainer.innerHTML = '';
  const allLines = rawMessage.split('\n');
  
  allLines.forEach(line => {
    const p = document.createElement('p');
    p.textContent = line.trim() === '' ? ' ' : line;
    p.style.opacity = '0';
    p.style.transform = 'translateY(15px)';
    p.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
    textContainer.appendChild(p);
  });

  const lines = textContainer.querySelectorAll('p');
  let currentLine = 0;

  function revealNextLine() {
    if (currentLine < lines.length) {
      lines[currentLine].style.opacity = '1';
      lines[currentLine].style.transform = 'translateY(0)';
      currentLine++;
      let nextDelay = 1200;
      if (currentLine < lines.length) {
         if (lines[currentLine].textContent.trim() === '') nextDelay = 500;
         if (lines[currentLine].textContent.includes('Enaku therium')) nextDelay = 1800;
      }
      setTimeout(revealNextLine, nextDelay);
    } else {
      const sig = document.getElementById('signature-block');
      sig.style.display = 'block';
      sig.style.animation = 'zoomIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
    }
  }
  revealNextLine();
}

function changeSlide(dir) { activeIndex = (activeIndex + dir + photoFiles.length) % photoFiles.length; document.getElementById('main-slider-img').src = photoFiles[activeIndex]; document.getElementById('main-slider-caption').innerText = photoCaptions[activeIndex]; document.getElementById('slide-index-counter').innerText = `${activeIndex + 1} / 11`; }
</script>
</body>
</html>
